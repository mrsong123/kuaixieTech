# Within the existing server { ... } for your production frontend origin:
# Put these locations BEFORE location / to avoid frontend SPA fallback.
location ~ ^/(public|rpc|portal|support|me|auth|payment-callback)(/|$) {
    client_max_body_size 11m;
    proxy_read_timeout 45s;
    proxy_send_timeout 45s;
    # This must match your Spring Boot host; /api prefix is injected internally.
    rewrite ^/(.*)$ /api/$1 break;
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
# Use the same URL contract with the domain configured in your mini program.
